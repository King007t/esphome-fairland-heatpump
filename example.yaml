# =============================================================================
# Device configuration for the ESPHome Device Builder (Home Assistant add-on).
#
# Create a new ESP32 device in the add-on, open its YAML and replace the content
# with this file. Add the four secrets from secrets.yaml.example to the add-on's
# "Secrets" (the API key the add-on generated for the device can be reused).
#
# The heat pump logic and the climate component are pulled from GitHub at build
# time; nothing needs to be copied into the add-on.
# =============================================================================
substitutions:
  name: fairland-heatpump
  friendly_name: Fairland Heat Pump
  # Optional overrides of the package defaults:
  # tx_pin: GPIO17
  # rx_pin: GPIO16
  # update_interval: 10s

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption:   # reuses the API encryption key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${name}-fallback
    password: !secret ap_password

captive_portal:

# Climate component from this repository
external_components:
  - source: github://King007t/esphome-fairland-heatpump@main
    components: [fairland_climate]

# Heat pump package (bus, entities, climate)
packages:
  fairland: github://King007t/esphome-fairland-heatpump/fairland-heatpump.yaml@main

# RS485 modules without automatic direction control (DE/RE pins): uncomment
# modbus:
#   id: modbus_bus
#   flow_control_pin: GPIO4

# Models that reject some working modes (e.g. InverX 13: only Smart and Silence):
# remove the unsupported options, the climate presets follow automatically
# select:
#   - id: !extend hp_working_mode
#     optionsmap:
#       "Super Silence": !remove
#       "Turbo": !remove

# Narrow the setpoint ranges (package defaults: heating 18-40, cooling 12-30,
# auto 12-40 °C); the climate entity adopts the new ranges automatically
# number:
#   - id: !extend hp_target_heating
#     min_value: 18
#     max_value: 32
#   - id: !extend hp_target_cooling
#     min_value: 15
#     max_value: 28
#   - id: !extend hp_target_auto
#     min_value: 18
#     max_value: 35
